<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Content Security Policy: the browser may only run this site's own scripts, and only load data from
       PokeAPI and TCGdex (trading cards), images from PokeAPI's GitHub and TCGdex, and the Google font. Update it if you add a new source. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://raw.githubusercontent.com https://assets.tcgdex.net; media-src https://raw.githubusercontent.com; connect-src https://pokeapi.co https://api.tcgdex.net; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéInfo</title>
  <meta name="description" content="Information about every Pokémon, region and game in the series.">
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">
      <span class="pokeball" aria-hidden="true"></span>
      PokéInfo
    </a>
    <nav id="nav">
      <a href="#/" data-route="" data-i18n="Home">Home</a>
      <a href="#/pokedex" data-route="pokedex">Pokédex</a>
      <a href="#/regions" data-route="regions" data-i18n="Regions">Regions</a>
      <a href="#/games" data-route="games" data-i18n="Games">Games</a>
      <a href="#/guides" data-route="guides" data-i18n="Guides">Guides</a>
      <a href="#/team" data-route="team" data-i18n="Team">Team</a>
      <a href="#/nuzlocke" data-route="nuzlocke" data-i18n="Nuzlocke">Nuzlocke</a>
      <a href="#/cards" data-route="cards" data-i18n="Cards">Cards</a>
      <a href="#/compare" data-route="compare" data-i18n="Compare">Compare</a>
    </nav>
    <button class="theme-btn" id="langBtn" type="button" aria-label="Cambiar a español">ES</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" data-i18n-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span data-i18n="Pokémon data provided by">Pokémon data provided by</span> <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>.
    <span data-i18n="Pokémon and Pokémon character names are trademarks of Nintendo, Game Freak and The Pokémon Company. Non-commercial fan site.">Pokémon and Pokémon character names are trademarks of Nintendo, Game Freak and The Pokémon Company. Non-commercial fan site.</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/names.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
