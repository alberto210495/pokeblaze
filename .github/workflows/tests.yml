# Runs the automated tests (tests/*.test.js) on every push and pull request.
# A red ✗ next to a commit on GitHub means something broke; open the run to see which test failed.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test "tests/*.test.js"
